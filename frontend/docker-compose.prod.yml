# Stack de PRODUCAO do frontend Valendo (VM dyotech.shop).
# Reusa a rede externa do backend (backend_default), criada por
# backend/docker-compose.prod.yml.
#
# Pre-requisitos na VM:
#   - Stack do backend ja rodando (de /backend com docker-compose.prod.yml)
#   - Nginx com server block dyotech.shop -> 127.0.0.1:3000 (frontend)
#     e /api/ -> 127.0.0.1:3001 (backend)
#   - .env populado com NEXT_PUBLIC_API_URL e NEXT_PUBLIC_WS_URL publicos
#
# Como subir na VM (a partir desta pasta /frontend):
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dyotech.shop/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://dyotech.shop}
    container_name: valendo-frontend
    ports:
      # Bind apenas em loopback - quem expoe pra fora e o Nginx (TLS + proxy reverso)
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    networks:
      - backend_default

networks:
  # Rede criada por backend/docker-compose.prod.yml (project name "backend" -> "backend_default")
  backend_default:
    external: true
