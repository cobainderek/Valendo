# Stack de PRODUCAO do backend Valendo (VM dyotech.shop).
# Sobe postgres + redis + backend com bind apenas em loopback - quem expoe
# pra fora e o Nginx (TLS + proxy reverso).
#
# Como subir na VM (a partir desta pasta /backend):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# A rede criada por este compose (backend_default) e reusada pelo frontend
# de producao via frontend/docker-compose.prod.yml.

services:
  postgres:
    image: postgres:16-alpine
    container_name: valendo-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-valendo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-valendo}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: valendo-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: valendo-backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-valendo}?schema=public
      PORT: 3001
      API_HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-https://dyotech.shop,https://www.dyotech.shop,http://localhost:3000}
      # Login com Google (GIS). O client_id e publico - o secret NUNCA entra aqui.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
